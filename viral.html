<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="viral.css">
    <title>viral video</title>
</head>
<body>
    <header>
         <div class="sitename">
            <h1>LET'S GO VIRAL</h1>
        </div>
    </header>


    <main>
        <div class="gametitle">
            <h1>Quiz Games</h1>
        </div>
        <div class="Scorescoutener">
        <div class="scoresSummary">
            <div class="scores">
                <h2 id="myscores">Scores:0</h2>
                <h2>/5</h2>
            </div>
            <div class="scoresVideo">
                <video src="video5.mp4" type="video/mp4" id="scores5video"></video>
                <video src="video4.mp4" type="video/mp4" id="scores4video"></video>
                <video src="video3.mp4" type="video/mp4" id="scores3video"></video>
            </div>
            <div class="backbtn">
                <button type="submit" onclick="backbutton()">BACK</button>
            </div>
        </div>
        </div>

        <div class="infoconteiner">
            <div class="question">
                <h3>1.whos the real hero in the philippine?</h3>
            </div>
            <div class="choicesconteiner">
                <div class="choices">
                    <input type="radio" name="choice1"value="A">
                    <label >A.rene</label>

                    <input type="radio" name="choice1"value="B">
                    <label >B.Rizal</label>

                    <input type="radio" name="choice1"value="C">
                    <label >C.Bonifacio</label>

                    <input type="radio" name="choice1"value="D">
                    <label >D.Lapu-Lapu</label>

                </div>
            </div>

        </div>


        <div class="infoconteiner">
            <div class="question">
                <h3>2.________I'm Gay</h3>
            </div>
            <div class="choicesconteiner">
                <div class="choices">
                    <input type="radio"  name="choice2"value="A">
                    <label>A.Yes</label>
                    <input type="radio" name="choice2"value="B">
                    <label>B.No</label>
                    <input type="radio" name="choice2"value="C">
                    <label>C.Maybe</label>
                    <input type="radio" name="choice2"value="D">
                    <label>D.All of the above</label>
                </div>
            </div>

        </div>

        <div class="infoconteiner">
            <div class="question">
                <h3>3.Anong tagalog ng RIGHT?</h3>
            </div>
            <div class="choicesconteiner">
                <div class="choices">
                    <input type="radio"  name="choice3"value="A">
                    <label >A.Tama</label>
                    <input type="radio" name="choice3"value="B">
                    <label >B.Karapatan</label>
                    <input type="radio" name="choice3"value="C">
                    <label >C.Kanan</label>
                    <input type="radio" name="choice3"value="D">
                    <label >D.Babae</label>
                </div>
            </div>

        </div>

        <div class="infoconteiner">
            <div class="question">
                <h3>4.which one has two zero and two four?</h3>
            </div>
            <div class="choicesconteiner">
                <div class="choices">
                    <input type="radio"  name="choice4"value="A">
                    <label>A.2044</label>
                    <input type="radio" name="choice4"value="B">
                    <label>B.0024</label>
                    <input type="radio" name="choice4"value="C">
                    <label>C.2024</label>
                    <input type="radio" name="choice4"value="D">
                    <label>D.0024</label>
                </div>
            </div>

        </div>

        <div class="infoconteiner">
            <div class="question">
                <h3> 5. As a student How many hours did you spend studying before the test?</h3>
            </div>
            <div class="choicesconteiner">
                <div class="choices">
                    <input type="radio"  name="choice5"value="A">
                    <label>5 hours</label>

                    <input type="radio" name="choice5"value="B">
                    <label>2 hours</label>

                    <input type="radio" name="choice5"value="C">
                    <label>5 minutes</label>

                    <input type="radio" name="choice5"value="D">
                    <label>stock knowledge</label>
                </div>
            </div>

        </div>
        <div class="btncontiener">
            <button type="submit" onclick="checkAnswer()">Submit</button>
        </div>
    </main>
    <footer>
        <div class="footerconteiner">
            <h1>YEAR 2026</h1>
        </div>
    </footer>
    <script src="viral.js"></script>
</body>
</html>
